[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	me-no-dev/AsyncTCP@^1.1.1
	me-no-dev/ESPAsyncWebServer@^1.2.3
	adafruit/Adafruit MLX90614 Library@^2.1.5
	256dpi/MQTT@^2.5.2
